# Standard r-lib check matrix: https://github.com/r-lib/actions/tree/v2-branch/examples
on:
  push:
    branches: [main, v070-percentile-flag]
  pull_request:
    branches: [main, calibration-contrib]
  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          # windows-devel ran WITHOUT lme4 (Suggests) 2026-07-11 ->
          # 2026-08-29, working around two heap-use-after-free bugs in
          # lme4 exposed by Rcpp 1.1.2 (lme4/lme4#990, GC-timing
          # dependent, ~50% of check runs failing under memory
          # pressure). lme4 2.0-6 (CRAN 2026-07-16) carries both fixes;
          # restored after 13 clean windows-devel runs with
          # lme4 2.0.6 + Rcpp 1.1.2 confirmed on the runner
          # (branch lme4-restore-trial, 2026-08-29).
          - {os: windows-latest, r: 'devel'}
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran", "--no-manual")'
          upload-snapshots: true
